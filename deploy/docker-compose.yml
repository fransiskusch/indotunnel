services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: indotunnel
      POSTGRES_PASSWORD: indotunnel
      POSTGRES_DB: indotunnel
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indotunnel"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      DATABASE_URL: postgres://indotunnel:indotunnel@postgres:5432/indotunnel?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      EDGE_ADDR: ":8080"
      API_ADDR: ":8081"
      TUNNEL_ADDR: ":7000"
      PUBLIC_HOST_SUFFIX: indotunnel.localhost
      PUBLIC_SCHEME: http
      CLIENT_IP_HASH_SALT: local-dev-salt
      DASHBOARD_ORIGIN: http://localhost:3000
      API_BASE_URL: http://server:8081
    ports:
      - "8080:8080"
      - "8081:8081"
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        API_BASE_URL: http://server:8081
    environment:
      API_BASE_URL: http://server:8081
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
