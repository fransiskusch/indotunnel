# IndoTunnel production nginx vhost (host-level nginx, not containerized)
# Origin targets are published on 127.0.0.1 by docker-compose.vps.yml:
#   API/control : 127.0.0.1:8081
#   Edge gateway: 127.0.0.1:18080
#   Dashboard   : 127.0.0.1:3000
# TLS cert: wildcard *.indotunnel.ai.id + indotunnel.ai.id (certbot --dns-cloudflare)

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name indotunnel.ai.id api.indotunnel.ai.id dashboard.indotunnel.ai.id *.indotunnel.ai.id;
    return 301 https://$host$request_uri;
}

# ---------- Main domain: dashboard + control API ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name indotunnel.ai.id api.indotunnel.ai.id dashboard.indotunnel.ai.id;

    ssl_certificate     /etc/letsencrypt/live/indotunnel.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indotunnel.ai.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    # Realtime SSE stream (must not be buffered) — keep BEFORE /api/
    location /api/events {
        proxy_pass http://127.0.0.1:8081/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Control API: /api/* -> server /v1/*
    location /api/ {
        proxy_pass http://127.0.0.1:8081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js dashboard
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}

# ---------- Wildcard tunnels: *.indotunnel.ai.id -> edge gateway ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Wildcard, not a regex: nginx matches SNI only against exact and wildcard
    # names, so a regex server_name falls through to the default_server cert.
    server_name *.indotunnel.ai.id;

    ssl_certificate     /etc/letsencrypt/live/indotunnel.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indotunnel.ai.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
}
