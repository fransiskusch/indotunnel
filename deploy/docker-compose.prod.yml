services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indotunnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indotunnel_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-indotunnel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indotunnel"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-indotunnel}:${POSTGRES_PASSWORD:-indotunnel_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-indotunnel}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      EDGE_ADDR: ":8080"
      API_ADDR: ":8081"
      TUNNEL_ADDR: ":7000"
      PUBLIC_HOST_SUFFIX: indotunnel.my.id
      PUBLIC_SCHEME: https
      CLIENT_IP_HASH_SALT: ${CLIENT_IP_HASH_SALT:-production-salt-secret-change-me}
      DASHBOARD_ORIGIN: https://indotunnel.my.id
      API_BASE_URL: http://server:8081
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dashboard
      args:
        API_BASE_URL: http://server:8081
    restart: unless-stopped
    environment:
      API_BASE_URL: http://server:8081
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - dashboard
      - server

volumes:
  pgdata:
