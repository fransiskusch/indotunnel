# Production reverse proxy: "/" -> dashboard, "/api" -> control API.
server {
    listen 80;
    server_name _;

    # Control API. The dashboard's Next.js rewrite targets /v1 directly; this
    # path is for direct API access through the proxy.
    location /api/ {
        proxy_pass http://server:8081/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # SSE must not be buffered.
    location /api/events {
        proxy_pass http://server:8081/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }
}
