# HTTP to HTTPS redirect
server {
    listen 80;
    server_name indotunnel.ai.id *.indotunnel.ai.id;
    return 301 https://$host$request_uri;
}

# Main Domain & Dashboard (indotunnel.ai.id & api.indotunnel.ai.id)
server {
    listen 443 ssl http2;
    server_name indotunnel.ai.id api.indotunnel.ai.id;

    ssl_certificate /etc/letsencrypt/live/indotunnel.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indotunnel.ai.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Control API endpoint
    location /api/ {
        proxy_pass http://server:8081/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Realtime SSE stream (must not be buffered)
    location /api/events {
        proxy_pass http://server:8081/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Dashboard
    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Wildcard Tunnels (*.indotunnel.ai.id) -> Edge Gateway
server {
    listen 443 ssl http2;
    # Wildcard, not a regex: nginx matches SNI only against exact and wildcard
    # names, so a regex server_name falls through to the default_server cert.
    server_name *.indotunnel.ai.id;

    ssl_certificate /etc/letsencrypt/live/indotunnel.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indotunnel.ai.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
